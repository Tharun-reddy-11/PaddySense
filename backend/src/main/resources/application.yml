server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: paddysense-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/paddysense_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Tharun@1126}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  jwt-secret: ${JWT_SECRET:paddysense-methane-emission-sustainable-rice-jwt-secret-key-2026}
  jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:48}
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}
  nasa-power-api-url: ${NASA_POWER_API_URL:https://power.larc.nasa.gov/api/temporal/daily/point}
